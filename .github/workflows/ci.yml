name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run test suite
        working-directory: app
        # `check`, not `test`: `test` is the Java suite only. `check` also
        # runs the client's vitest suite and tsc --noEmit, neither of which
        # anything ran before — the bundler strips types without checking
        # them, so type errors reached the browser rather than the build.
        run: ./gradlew --no-daemon check

  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Compose
        run: docker compose config

      - name: Build app and bundled door images
        run: docker compose build app cityline-door
